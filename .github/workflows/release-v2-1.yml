name: Publish Savsani Family release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v2.1 with the APK and the Windows launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1 >/dev/null 2>&1 || gh release create v2.1 --title "Savsani Family V2.1 (latest)" --latest --notes "V2.1: 36 languages (machine translated), language picker; family chat, glass theme and dark logo from V2. Website works on any phone or PC. Tested in a headless browser only; the APK and exe have not been run on a real device."
          gh release upload v2.1 release/Savsani_Family_V2_1.apk release/Savsani_Family_Windows.exe --clobber
