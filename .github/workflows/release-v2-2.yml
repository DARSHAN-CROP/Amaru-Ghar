name: Publish Savsani Family release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v2.2 with the APK and the Windows launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.2 >/dev/null 2>&1 || gh release create v2.2 --title "Savsani Family V2.2 (latest)" --latest --notes "V2.2: fixes creating a family when signed in with Google in the Android app (the sign-in token request used the wrong content type). Website works on any phone or PC. Tested in a headless browser only; the APK and exe have not been run on a real device."
          gh release upload v2.2 release/Savsani_Family_V2_2.apk release/Savsani_Family_Windows.exe --clobber
