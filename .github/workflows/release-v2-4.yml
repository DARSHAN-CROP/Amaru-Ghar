name: Publish Savsani Family release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v2.4 with the APK and the Windows launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.4 >/dev/null 2>&1 || gh release create v2.4 --title "Savsani Family V2.4 (latest)" --latest --notes "V2.4: the attachment menu now slides up from the bottom (animated bottom sheet) like WhatsApp; poll, contact and event forms use the same sheet. Website works on any phone or PC. Tested in a headless browser only; the APK and exe have not been run on a real device."
          gh release upload v2.4 release/Savsani_Family_V2_4.apk release/Savsani_Family_Windows.exe --clobber
