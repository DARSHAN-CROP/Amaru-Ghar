name: Publish Savsani Family release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release v2.5 with the APK and the Windows launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.5 >/dev/null 2>&1 || gh release create v2.5 --title "Savsani Family V2.5 (latest)" --latest --notes "V2.5: full-screen photo viewer in the family chat (swipe between photos, pinch/double-tap zoom, save, share, open in another app, delete your own). Website works on any phone or PC. Tested in a headless browser only; the APK and exe have not been run on a real device."
          gh release upload v2.5 release/Savsani_Family_V2_5.apk release/Savsani_Family_Windows.exe --clobber
