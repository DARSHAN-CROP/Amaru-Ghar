function dkey(d){d=d||new Date();var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function pd(s){return new Date(s+"T00:00:00")}
function sameMonth(ts){var a=new Date(ts),n=new Date();return a.getFullYear()===n.getFullYear()&&a.getMonth()===n.getMonth()}
function dstr(s){return pd(s).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function nextOcc(r){var d=pd(r.date),n=new Date();n.setHours(0,0,0,0);if(r.repeat==="year"){while(d<n)d.setFullYear(d.getFullYear()+1)}else if(r.repeat==="month"){while(d<n)d.setMonth(d.getMonth()+1)}return d}
function daysTo(d){var n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)}
function reminders(){return S.rem.map(function(r){var d=nextOcc(r);return{r:r,d:d,n:daysTo(d)}}).filter(function(x){return !(x.r.repeat==="none"&&x.r.done)}).sort(function(a,b){return a.d-b.d})}

function spentCat(c){return S.exp.reduce(function(a,e){return a+(sameMonth(e.ts)&&e.cat===c?e.amt:0)},0)}
function monthSpent(){return S.exp.reduce(function(a,e){return a+(sameMonth(e.ts)?e.amt:0)},0)}
